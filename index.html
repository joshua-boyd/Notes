<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pencil Notes">
<meta name="theme-color" content="#f7f7f8">
<title>Pencil Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="group">
      <button id="sideBtn" title="All notes" aria-label="All notes">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <input id="title" placeholder="Untitled" autocomplete="off" spellcheck="false">
    <div class="group" id="tools">
      <button data-tool="pen" title="Pen" aria-label="Pen">
        <svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.2L15.5 5.5a2.1 2.1 0 0 1 3 3L8.2 18.8z"/><path d="M13.5 7.5l3 3"/></svg>
      </button>
      <button data-tool="hl" title="Highlighter" aria-label="Highlighter">
        <svg viewBox="0 0 24 24"><path d="M4 20h7"/><path d="M7.5 17.5l-2-2 1.5-3.5 7-8 5 5-8 7z"/></svg>
      </button>
      <button data-tool="eraser" title="Eraser (removes whole strokes)" aria-label="Eraser">
        <svg viewBox="0 0 24 24"><path d="M9 20h11"/><path d="M4.6 15.4l9.2-9.2a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19H8.2z"/><path d="M9 11l5 5"/></svg>
      </button>
    </div>
    <div class="group" id="swatches"></div>
    <div class="group" id="sizes"></div>
    <span class="sep"></span>
    <div class="group">
      <button id="undoBtn" title="Undo" aria-label="Undo">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button id="redoBtn" title="Redo" aria-label="Redo">
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
    </div>
    <span class="sep"></span>
    <div class="group">
      <button id="zoomOut" title="Zoom out" aria-label="Zoom out">
        <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
      </button>
      <button id="zoomLabel" class="zoom-label" title="Reset zoom">100%</button>
      <button id="zoomIn" title="Zoom in" aria-label="Zoom in">
        <svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg>
      </button>
    </div>
    <span class="sep"></span>
    <div class="group">
      <button id="fingerBtn" title="Draw with finger (off: fingers scroll, only the Pencil writes)" aria-label="Draw with finger">
        <svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 10.5V4a1.5 1.5 0 0 1 3 0v6.5"/><path d="M14 10.5V6a1.5 1.5 0 0 1 3 0v8.5A6.5 6.5 0 0 1 10.5 21h-.3a6 6 0 0 1-4.8-2.4L2.9 15a1.6 1.6 0 0 1 2.5-2L8 15.5"/></svg>
      </button>
      <select id="paperSel" title="Page size" aria-label="Page size">
        <option value="letter">Letter</option>
        <option value="a4">A4</option>
      </select>
      <button id="pdfBtn" class="primary" title="Export as PDF">Export PDF</button>
    </div>
  </header>

  <div id="scroller">
    <div id="pages">
      <div id="addBar">
        <span>Add page</span>
        <button data-add="blank">Blank</button>
        <button data-add="lined">Lined</button>
        <button data-add="grid">Grid</button>
      </div>
    </div>
  </div>
</div>

<div id="backdrop"></div>
<aside id="sidebar">
  <div class="side-head">
    <h1>Notes</h1>
    <button id="newNoteBtn" class="primary">New note</button>
  </div>
  <ul id="noteList"></ul>
  <div class="side-foot">
    <button id="backupBtn" title="Save a copy of every note as a file">Back up all notes</button>
    <button id="restoreBtn" title="Load notes from a backup file">Restore</button>
    <input id="restoreInput" type="file" accept=".json,application/json" hidden>
  </div>
</aside>

<dialog id="fileDialog">
  <p id="fileMsg"></p>
  <div class="dialog-row">
    <button id="fileShare" class="primary">Share / Save to Files</button>
    <button id="fileDownload">Download</button>
    <button id="fileClose">Close</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
